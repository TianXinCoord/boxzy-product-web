<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BOXZY · 本地 UI 还原检查</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#26231d;font:15px/1.5 system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #d7d0bf}h1{font-size:20px;margin:0 0 6px}p{margin:0;color:#716957}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 24px}button,a{font:inherit}button{padding:9px 16px;border:1px solid #b9a573;border-radius:7px;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#26231d;color:#ffe29a}a{color:#655020}main{padding:0 24px 24px}.stage{position:relative;width:100%;max-width:1366px;overflow:hidden;background:#090909;border:1px solid #a18a46;border-radius:12px}iframe{position:absolute;left:0;top:0;width:1366px;height:768px;border:0;transform-origin:top left}.links{display:flex;gap:24px;margin-bottom:12px}
</style><header><h1>BOXZY · 本地 UI 还原检查</h1><p>对应本次反馈的四个页面。已确认版本，与主 Web 和说明文档使用同一实现。</p></header><nav aria-label="页面切换"><button data-key="empty" aria-pressed="true">图 1 · 收藏空状态</button><button data-key="failed" aria-pressed="false">图 3 · 开盒失败</button><button data-key="loading" aria-pressed="false">图 5 · 加载中</button><button data-key="updating" aria-pressed="false">图 7 · 奖池更新</button></nav><main><div class="links"><a id="full" href="boxzy-collection.html?preview=demo&amp;empty=1&amp;guide=local-empty-v4" target="_blank">打开当前页面原尺寸 ↗</a><a id="guide" href="guide/START-HERE.html#collection-empty" target="_blank">查看对应说明 ↗</a></div><div class="stage"><iframe title="收藏空状态" src="boxzy-collection.html?preview=demo&amp;empty=1&amp;guide=local-empty-v4"></iframe></div></main><script>
const routes={empty:'boxzy-collection.html?preview=demo&empty=1&guide=local-empty-v4',failed:'boxzy-interactive.html?preview=demo&screen=failed&guide=local-failed-v4',loading:'boxzy-interactive.html?preview=demo&screen=loading&guide=local-loading-v4',updating:'boxzy-interactive.html?preview=demo&screen=updating&guide=local-updating-v4'};
const frame=document.querySelector('iframe'),stage=document.querySelector('.stage');
new ResizeObserver(()=>{const scale=stage.clientWidth/1366;stage.style.height=768*scale+'px';frame.style.transform='scale('+scale+')'}).observe(stage);
document.querySelectorAll('button[data-key]').forEach(button=>button.addEventListener('click',()=>{const key=button.dataset.key;frame.src=routes[key];frame.title=button.textContent;document.getElementById('full').href=routes[key];document.getElementById('guide').href='guide/START-HERE.html#'+(key==='empty'?'collection-empty':'opening-'+key);document.querySelectorAll('button[data-key]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));
</script></html>
